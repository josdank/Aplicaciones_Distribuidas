<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mapa Interactivo del Ecuador</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>🗺️ Mapa Interactivo del Ecuador</h1>
        </header>
        <main class="main-layout">
            <div id="map"></div>
            <aside id="info-section">
                
                <input type="text" id="search-input" placeholder="🔍 Buscar provincia..." />
                <div class="top-buttons">
                    <button id="toggle-list" class="icon-btn" title="Mostrar/Ocultar Lista">📋</button>
                    <button id="reset-map" class="icon-btn" title="Reiniciar Mapa">🧭</button>
                </div>
                <div id="provincia-list" class="prov-list"></div>

                <div id="info-panel">
                    <h2>📍 Información</h2>
                    <p><strong>Provincia:</strong> <span id="nombre-provincia">Seleccione una</span></p>
                    <p><strong>Capital:</strong> <span id="capital-provincia">-</span></p>
                    <p><strong>Área:</strong> <span id="area-provincia">-</span></p>
                    <p><strong>Población:</strong> <span id="poblacion-provincia">-</span></p>
                </div>
            </aside>
        </main>
        <footer>
            <p>Práctica Aplicaciones Distribuidas - ESFOT - 2025</p>
        </footer>
        <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
        <script src="{{ url_for('static', filename='js/map.js') }}"></script>
    </div>
</body>
</html>
